name: Atualizar estatisticas do perfil

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/generate_profile_stats.py'
      - '.github/workflows/profile-stats.yml'

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  profile-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate public repository cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: Hyouem
        run: python scripts/generate_profile_stats.py
      - name: Validate images and version README URLs
        run: |
          python - <<'PY'
          import os
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          names = ('overview', 'languages', 'stack')
          for name in names:
              ET.parse(f'assets/stats/{name}.svg')
          p = Path('README.md')
          original = p.read_text(encoding='utf-8')
          version = f'{os.environ["GITHUB_RUN_ID"]}-{os.environ["GITHUB_RUN_ATTEMPT"]}'
          result = original
          for name in names:
              pattern = r'(\./assets/stats/' + name + r'\.svg)(?:\?v=[^"\s>]*)?'
              result, n = re.subn(pattern, lambda m: m.group(1) + '?v=' + version, result)
              if n != 1:
                  raise SystemExit(f'Expected one {name}.svg URL, got {n}')
          p.write_text(result, encoding='utf-8')
          PY
      - name: Publish cards and README
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/stats/overview.svg assets/stats/languages.svg assets/stats/stack.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh profile cards'
            git push
          fi
