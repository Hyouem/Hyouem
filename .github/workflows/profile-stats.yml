name: Atualizar estatisticas do perfil
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: write
concurrency:
  group: profile-stats
  cancel-in-progress: false
jobs:
  profile-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate public repository statistics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: Hyouem
        run: python scripts/generate_profile_stats.py
      - name: Validate SVG and version README links
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python scripts/version_profile_stats.py
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for p in (Path('assets/stats/overview.svg'),Path('assets/stats/languages.svg')):
              assert p.stat().st_size > 100
              ET.parse(p)
          PY
      - name: Publish cards and README
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/stats/overview.svg assets/stats/languages.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh profile statistics'
            git push
          fi
