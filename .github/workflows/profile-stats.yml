name: Atualizar estatisticas do perfil

on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'

permissions:
  contents: write

jobs:
  profile-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar estatisticas a partir dos repositorios publicos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: Hyouem
        run: python scripts/generate_profile_stats.py
      - name: Publicar SVGs no proprio repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test -s assets/stats/overview.svg
          test -s assets/stats/languages.svg
          python scripts/version_profile_stats.py
          git add README.md assets/stats/overview.svg assets/stats/languages.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update profile statistics"
            git push
          fi
